  - node_modules
  - .github
  - scripts
  - workers
  - blog
  - portafolio
  - recursos
  - tools
  - DOCKER
  - SCRIPTS
  - .ENV
  - .gitignore
  - .nojekyll
  - _redirects
  - _headers
  - 404.html
  - README.md
  - admin.html
  - afiliados.html
  - ai-assistant.html
  - android-chrome-192x192.png
  - android-chrome-512x512.png
  - apple-touch-icon.png
  - auditorias-masivas.html
  - aviso-legal.html
  - bot-leads.js
  - calendario.html
  - chatbot-seguridad.js
  - chatbot-styles.css
  - contacto.html
  - curso-express.html
  - dashboard.html
  - deploy.sh
  - estilo-min.css
  - estilo.css
  - etica.html
  - favicon-16x16.png
  - favicon-32x32.png
  - favicon.ico
  - google-site-verification.html
  - kit-herramientas.html
  - landing-urgencias.html
  - marketplace.html
  - nginx.conf
  - nodemon.json
  - package.json
  - railway.json
  - render.yaml
  - robots.txt
  - run_all_tests.bat
  - run_all_tests.sh
  - script.js
  - server.js
  - site.webmanifest
  - sitemap.xml
  - suscripcion.html
  - tickets.html
  - tools.html
  - wordpress-seguro.html

# Compresión automática (si usas Jekyll)
compress_html:
  clippings: all
  comments: all
  endings: all
  blanklines: false
  profile: false
